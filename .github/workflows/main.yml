name: Deploy PhishLab Server (DEV)

on:
  push:
    branches: ["dev"]

concurrency:
  group: phishlab-dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    env:
      TZ: ${{ secrets.TZ }}
      DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}

      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      APP_ENV: ${{ secrets.APP_ENV }}
      APP_DEBUG: ${{ secrets.APP_DEBUG }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_KEY: ${{ secrets.APP_KEY }}

      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate required secrets (fail fast)
        shell: bash
        run: |
          set -e
          req_vars=(
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
            APP_ENV APP_DEBUG APP_URL APP_KEY
            DB_DATABASE DB_USERNAME DB_PASSWORD
          )
          for v in "${req_vars[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "❌ Missing required secret: $v"
              exit 1
            fi
          done
          echo "✅ Secrets OK"

      - name: Deploy docker compose (build + up)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker compose version

          docker compose pull || true
          docker compose up -d --build
          docker compose ps

      - name: Install deps + migrate
        working-directory: server
        shell: bash
        run: |
          set -e
          docker compose exec -T api php -v

          # Ensure vendor exists (now stored in docker volume, not in repo)
          docker compose exec -T api composer install --no-interaction --prefer-dist --no-progress

          docker compose exec -T api php artisan migrate --force

      - name: Smoke check nginx
        shell: bash
        run: |
          set -e
          curl -fsS http://127.0.0.1:8082/ > /dev/null
          echo "✅ Nginx OK on :8082"
