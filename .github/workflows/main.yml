name: Deploy (dev) to VPS

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "== Go to project dir =="
            cd "${{ secrets.VPS_PROJECT_DIR }}"

            echo "== Git update =="
            git fetch --all --prune
            git checkout dev
            git reset --hard origin/dev

            echo "== Export env (from GitHub Secrets) =="
            export APP_ENV='${{ secrets.APP_ENV }}'
            export APP_DEBUG='${{ secrets.APP_DEBUG }}'
            export APP_URL='${{ secrets.APP_URL }}'
            export APP_KEY='${{ secrets.APP_KEY }}'

            export DB_CONNECTION='${{ secrets.DB_CONNECTION }}'
            export DB_HOST='${{ secrets.DB_HOST }}'
            export DB_PORT='${{ secrets.DB_PORT }}'
            export DB_DATABASE='${{ secrets.DB_DATABASE }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_ROOT_PASSWORD='${{ secrets.DB_ROOT_PASSWORD }}'

            # Optionnel (si tu en as besoin)
            # export REDIS_HOST='${{ secrets.REDIS_HOST }}'
            # export MAIL_HOST='${{ secrets.MAIL_HOST }}'

            echo "== Docker compose up (server/) =="
            cd server

            docker compose pull || true
            docker compose up -d --build

            echo "== Laravel cache + migrations (si container 'api') =="
            # Si ton service s'appelle autrement, change "api"
            docker compose exec -T api php artisan config:clear || true
            docker compose exec -T api php artisan config:cache
            docker compose exec -T api php artisan route:cache || true
            docker compose exec -T api php artisan view:cache || true
            docker compose exec -T api php artisan migrate --force || true

            echo "== Done =="
            docker compose ps
