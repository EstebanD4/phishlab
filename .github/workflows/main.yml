name: CI-CD

on:
  push:
    branches: ["dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /var/www/phishlab/

            git fetch --all
            git reset --hard origin/main

            echo "Generating .env from GitHub Secrets..."

            cat > .env <<EOF
            APP_NAME=${{ secrets.APP_NAME }}
            APP_ENV=${{ secrets.APP_ENV }}
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=${{ secrets.APP_DEBUG }}
            APP_URL=${{ secrets.APP_URL }}

            LOG_CHANNEL=${{ secrets.LOG_CHANNEL }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL }}

            DB_CONNECTION=pgsql
            DB_HOST=db
            DB_PORT=5432
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            chmod 600 .env

            docker compose up -d --build

            docker compose exec -T api php artisan migrate --force
            docker compose exec -T api php artisan config:clear
            docker compose exec -T api php artisan config:cache
            docker compose exec -T api php artisan route:cache
